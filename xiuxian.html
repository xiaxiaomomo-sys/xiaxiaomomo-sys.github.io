    btn.innerText = "🛑 点击取消聆听"; btn.style.animation = "none"; btn.style.opacity = "0.9";
    btn.style.background = "#c41e3a"; btn.style.borderColor = "#c41e3a";
    status.innerHTML = "请大声说话！已识别 <span style='color:var(--cinnabar);font-weight:bold;font-size:1.1rem'>0</span> / 3 次";

    var count = 0, audioChunks = [];

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
        if (window._eggForceStop) { stream.getTracks().forEach(function(t){ t.stop(); }); return; }
        window._eggStream = stream;
        var mediaRecorder = new MediaRecorder(stream);
        window._eggRecorder = mediaRecorder;
        mediaRecorder.start();

        mediaRecorder.ondataavailable = function(e) { if (e.data && e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = function() {
            if (window._eggForceStop && count < 3) return;
            if (count >= 3) {
                var audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
                var audioUrl = URL.createObjectURL(audioBlob);
                showEggRewardModal(audioUrl);
            } else { resetEggUI(); }
        };

        var AudioContext = window.AudioContext || window.webkitAudioContext;
        var audioCtx = new AudioContext(); window._eggAudioCtx = audioCtx;
        var source = audioCtx.createMediaStreamSource(stream);
        var analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
        source.connect(analyser);
        var dataArray = new Uint8Array(analyser.frequencyBinCount);
        var isShouting = false, silenceTimer = 0;

        function checkVolume() {
            if (window._eggForceStop) return;
            analyser.getByteFrequencyData(dataArray);
            var sum = 0; for(var i=0; i<dataArray.length; i++) sum += dataArray[i];
            var avg = sum / dataArray.length;

            if (avg > 30) { 
                if (!isShouting) {
                    isShouting = true; count++;
                    if (count >= 3) {
                        status.innerHTML = "<span style='color:var(--jade);font-weight:bold'>识别成功！试炼完成！正在生成奖励...</span>";
                        window._eggForceStop = true;
                        setTimeout(function(){
                            if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
                            stream.getTracks().forEach(function(t){ t.stop(); });
                            audioCtx.close();
                        }, 800);
                        return;
                    } else { status.innerHTML = "请大声喊！已识别 <span style='color:var(--cinnabar);font-weight:bold;font-size:1.1rem'>" + count + "</span> / 3 次"; }
                }
                silenceTimer = 0; 
            } else {
                silenceTimer++;
                if (silenceTimer > 40) isShouting = false;
            }
            requestAnimationFrame(checkVolume); 
        }
        checkVolume();
    }).catch(function(err) { alert("未获得麦克风权限，试炼无法开启！"); resetEggUI(); });

    function resetEggUI() {
        window._eggListening = false; window._eggForceStop = true;
        btn.disabled = false; btn.innerText = "🎙️ 开启隐藏试炼";
        btn.style.opacity = "1"; btn.style.background = "linear-gradient(135deg, #ab47bc, #7b68ae)";
        btn.style.borderColor = "#7b68ae";
        status.innerHTML = "对着麦克风喊3次“林深你真帅”或“林深最帅”试试？";
    }
};

    mask.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;display:flex;align-items:center;justify-content:center;animation:gfFade 0.3s ease forwards;backdrop-filter:blur(3px);';

    h += '<div style="font-size:4.5rem;margin-bottom:10px;animation:fs 2s ease-in-out infinite">🎁</div>';
    h += '<h3 style="color:var(--lv);font-family:\'Ma Shan Zheng\',cursive;font-size:1.8rem;margin-bottom:8px">试炼通过！彩蛋解锁</h3>';
    h += '<p style="font-size:.95rem;color:var(--txb);margin-bottom:16px;line-height:1.7">恭喜你获得林深大大的隐藏奖励！<br>商城专属图标已解锁<br><span style="color:var(--yw);font-weight:900;font-size:1.3rem">金币 + 1000 💰</span></p>';
    h += '<div style="background:var(--b50);padding:14px;border-radius:12px;margin-bottom:20px;border:1px dashed var(--b200)">';
    h += '<p style="font-size:.8rem;color:var(--txm);margin-bottom:8px;font-weight:bold">👇 下面是你夸我帅的绝版“社死”录音：</p>';
    h += '<audio controls autoplay src="' + audioUrl + '" style="width:100%;height:40px;outline:none;border-radius:8px"></audio>';
    h += '</div><button id="eggCloseBtn" class="xg-btn primary" style="width:100%;padding:12px;border-radius:99px;font-size:1rem;background:linear-gradient(135deg,var(--lv),#ab47bc);border-color:var(--lv);box-shadow:0 4px 15px rgba(123,104,174,.4)">太羞耻了，快关掉！</button></div>';
    mask.innerHTML = h; document.body.appendChild(mask);
    document.getElementById('eggCloseBtn').onclick = function() { mask.remove(); rc(); };
}

/* === 排行榜每日重置 === */
function checkLeaderboardReset(){
    var today=new Date().toISOString().split('T')[0];
    var lastReset=localStorage.getItem('xx_lb_reset');
    if(lastReset!==today){
        localStorage.setItem('xx_lb_reset',today);
        try{_sb.from('xiuxian_leaderboard').delete().neq('id','_never_')}catch(e){}
        if(G.p) saveXiuxianProg();
    }
}
function scheduleResetCheck(){
    var now=new Date();
    var tomorrow=new Date(now);
    tomorrow.setDate(tomorrow.getDate()+1);
    tomorrow.setHours(0,0,0,0);
    var msUntilReset=tomorrow-now;
    setTimeout(function(){
        checkLeaderboardReset();
        scheduleResetCheck();
    },msUntilReset);
}
checkLeaderboardReset();
scheduleResetCheck();

/* ===== 定时关服系统 ===== */
function checkShutdown(){
    var now=new Date();
    var h=now.getHours(), m=now.getMinutes();
    // 00:30 - 08:00 关服时间
    if((h===0&&m>=30)||(h>=1&&h<8)){
        document.getElementById('shutdownMask').style.display='flex';
        // 计算距离08:00的倒计时
        var target=new Date(now);
        if(h<8){target.setHours(8,0,0,0)}
        else{target.setDate(target.getDate()+1);target.setHours(8,0,0,0)}
        var diff=target-now;
        var dh=Math.floor(diff/3600000);
        var dm=Math.floor((diff%3600000)/60000);
        var ds=Math.floor((diff%60000)/1000);
        document.getElementById('shutdownCountdown').textContent=dh+'时'+dm+'分'+ds+'秒后开放';
        // 阻止游戏操作
        if(typeof stopAuto==='function')stopAuto();
        return true;
    }
    // 00:25 - 00:30 提醒时间
    if(h===0&&m>=25&&m<30){
        document.getElementById('shutdownWarning').style.display='block';
        var remain=30-m;
        document.getElementById('shutdownTimer').textContent=(remain-1)+':'+(60-now.getSeconds()).toString().padStart(2,'0');
        // 自动存档
        if(typeof autoSave==='function')autoSave();
        if(typeof forceSaveCloud==='function')forceSaveCloud();
    }
    return false;
}
// 每秒检查
setInterval(checkShutdown,1000);
// 页面加载时检查
if(checkShutdown()) { /* blocked */ } else {
rc();
}
})();
